[project]
name = "tenon"
version = "0.7.0"
description = "本地、单用户、可离线验证的编程 Agent（自研 ReAct 编排；TUI + 无头 CLI）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic-settings>=2.14.2",
    # mcp 的传递依赖；显式下限避免安装时解析到存在 JWT 校验漏洞的旧版本。
    "pyjwt>=2.15.0",
    "pyyaml>=6.0.3",
    "textual>=2.1.0",
]

[project.scripts]
tenon = "tenon.app.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
timeout_method = "thread"
markers = [
    "unit: fast isolated behavior tests",
    "contract: cross-implementation or architectural contract tests",
    "integration: tests crossing multiple application components",
    "e2e: end-to-end entrypoint or user-flow tests",
    "platform: tests for operating-system-specific behavior",
    "security: security policy, boundary, and rejection tests",
    "performance: benchmark and performance regression tests",
    "slow: tests that are intentionally slower than the fast test set",
    "compatibility: migration-period or long-lived compatibility contract tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 正确性检查 (E9/F) 是必须始终通过的基线;在此基础上启用导入排序 (I)、
# 现代化语法 (UP)、常见缺陷 (B) 与部分 SIM 简化规则。仍存在人工判断的
# 子规则 (B904/SIM105/SIM102/B905/UP04x) 暂不纳入,避免一次性大范围重构。
select = ["E9", "F821", "F841", "I", "UP037", "UP035", "UP041", "UP012", "SIM114", "SIM117", "SIM300", "SIM905", "SIM101", "SIM103", "SIM108", "SIM211", "B004", "B009", "B010"]

[tool.ruff.lint.per-file-ignores]
# 测试和脚本允许 assert 与临时路径;仅生产层参与更严格规则。
"tests/**" = ["S101"]


[tool.mypy]
# 类型门禁按层棘轮推进，见 scripts/type_scan.py 与 docs/type-baseline.json。
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
# 逐层调用时避免把被依赖模块的错误重复计入当前层。
